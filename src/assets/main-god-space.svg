<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">主神空間核心投影</title>
  <desc id="desc">深色空間中有發光圓環、懸浮石板與紅色警戒光。</desc>
  <defs>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#30231f"/>
      <stop offset="0.54" stop-color="#171412"/>
      <stop offset="1" stop-color="#090807"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="43%" r="42%">
      <stop offset="0" stop-color="#f1eadb" stop-opacity="0.94"/>
      <stop offset="0.13" stop-color="#d7a84d" stop-opacity="0.7"/>
      <stop offset="0.38" stop-color="#58b8aa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#171412" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#floor)"/>
  <rect y="520" width="1200" height="240" fill="#100e0c"/>
